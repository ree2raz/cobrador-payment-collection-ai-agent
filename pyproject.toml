[project]
name = "cobrador-payment-collection-ai-agent"
version = "0.1.0"
description = "Cobrador the AI Agent that collects payment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tenacity>=8.3.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "arize-phoenix>=8.0.0",
    "arize-phoenix-otel>=0.6.0",
    "openinference-instrumentation-openai>=0.1.0",
    "requests>=2.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.uv]
# Cutoff set to 2026-05-08 (one day after urllib3 2.7.0 release) to include the
# fix for CVE-2026-44431 and CVE-2026-44432 while keeping the rest of the
# dependency tree frozen. Update this date periodically (~biweekly).
exclude-newer = "2026-05-08T00:00:00Z"
